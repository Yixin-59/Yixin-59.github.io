name: Deploy personal website to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Set site address from GitHub Pages
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          mkdir -p local
          ruby -ryaml -e 'File.write("local/pages.yml", {"url" => ENV.fetch("SITE_ORIGIN"), "baseurl" => ENV.fetch("SITE_BASE_PATH"), "repository" => ENV.fetch("GITHUB_REPOSITORY")}.to_yaml)'
      - name: Build site
        run: bundle exec jekyll build --strict_front_matter --config _config.yml,local/pages.yml
        env:
          JEKYLL_ENV: production
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
